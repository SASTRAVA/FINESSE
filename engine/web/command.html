<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SASTRAVA · COMMAND</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Fira Sans',ui-sans-serif,system-ui,Segoe UI,Roboto}
  .brand,h1,h2,h3,.stat .v,.pill,.tab,.k,.v,code{font-family:'Fira Code',ui-monospace,Consolas,monospace}
  button,.tab{cursor:pointer}
  :focus-visible{outline:2px solid var(--cyan,#33e6ff);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
  :root{--bg:#05080d;--panel:#0a1018;--line:#16263a;--txt:#c8e6ff;
        --dim:#5f7899;--cyan:#2ff3ff;--gold:#ffcf5c;--green:#3ff59a;--red:#ff5a5a;--amber:#ff9d3c;}
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.5 ui-monospace,Consolas,Menlo,monospace;color:var(--txt);
       background:
        repeating-linear-gradient(0deg,rgba(20,40,60,.04) 0 2px,transparent 2px 4px),
        radial-gradient(900px 500px at 80% -10%,#0c1c2e 0,var(--bg) 60%);height:100vh;overflow:hidden}
  .mono{font-variant-numeric:tabular-nums}
  .classified{position:fixed;top:0;left:0;right:0;height:22px;background:repeating-linear-gradient(
        45deg,#1a0000,#1a0000 10px,#2a0000 10px,#2a0000 20px);color:#ff8a8a;font-size:11px;
        letter-spacing:3px;text-align:center;line-height:22px;z-index:20;border-bottom:1px solid #3a0000}
  button{font:inherit;background:#0c2036;color:var(--cyan);border:1px solid var(--line);
         border-radius:6px;padding:7px 12px;cursor:pointer;letter-spacing:1px}
  button:hover{border-color:var(--cyan);box-shadow:0 0 8px rgba(47,243,255,.3)}
  button.hot{color:var(--gold);border-color:#4a3a10}
  input,select{font:inherit;background:#060c14;color:var(--txt);border:1px solid var(--line);
         border-radius:6px;padding:7px 9px;width:100%}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;
        box-shadow:inset 0 0 30px rgba(10,30,50,.3)}
  h3{margin:0 0 8px;font-size:12px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;
     border-bottom:1px solid var(--line);padding-bottom:6px}
  #gate,#login{position:fixed;inset:0;display:grid;place-items:center;z-index:15;background:var(--bg)}
  #wrap{display:none;height:100vh;padding:30px 12px 12px;gap:10px;
        grid-template-columns:260px 1fr 340px;grid-template-rows:44px 1fr;overflow:hidden}
  header{grid-column:1/4;display:flex;gap:14px;align-items:center;padding:0 6px}
  .col{overflow:auto;display:flex;flex-direction:column;gap:10px}
  .kv{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
  .kv .v{color:var(--cyan)}
  .lamp{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  .stage{margin-bottom:8px}
  .stage h4{margin:0;font-size:11px;color:var(--amber);letter-spacing:1px}
  .lead{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:4px 0;background:#070e17;font-size:12px}
  .lead .fit{float:right;color:var(--gold)}
  .feed{display:flex;flex-direction:column;gap:5px;overflow:auto;font-size:12px}
  .ev{border-left:3px solid var(--line);padding:4px 8px;background:#070e17;border-radius:0 6px 6px 0}
  .ev.spawn{border-color:#b98cff}.ev.think{border-color:var(--cyan)}.ev.done{border-color:var(--green)}
  .ev.memory,.ev.learn{border-color:var(--gold)}.ev.error{border-color:var(--red)}.ev.tool{border-color:var(--amber)}
  .ev .a{color:var(--dim)}
  .aud{font-size:11px;color:var(--dim);border-bottom:1px dashed #12202f;padding:3px 0}
  .badge{border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:11px;color:var(--gold)}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  .big{font-size:22px;color:var(--cyan);text-shadow:0 0 12px rgba(47,243,255,.4)}
  a{color:var(--cyan)}
</style>
</head>
<body>
<div class="classified">◤ SASTRAVA COMMAND — RESTRICTED : CEO / COO CLEARANCE ONLY ◢</div>

<div id="login">
  <div class="card" style="width:340px">
    <h3>Secure Access</h3>
    <label>Email</label><input id="li_email"/>
    <label>Password</label><input id="li_pw" type="password"/>
    <div style="height:10px"></div>
    <button onclick="login()" style="width:100%">AUTHENTICATE ▸</button>
    <div id="li_err" style="color:var(--red);font-size:12px;min-height:16px"></div>
  </div>
</div>

<div id="gate" style="display:none">
  <div class="card" style="text-align:center">
    <div class="big" style="color:var(--red)">⛔ ACCESS DENIED</div>
    <p>Command center requires CEO / COO clearance.</p>
    <button onclick="location.href='/'">Return to operations dashboard</button>
  </div>
</div>

<div id="wrap">
  <header>
    <div class="lamp"></div><b style="letter-spacing:2px">SASTRAVA COMMAND</b>
    <span class="badge" id="who">—</span>
    <span class="badge" id="sysline">—</span>
    <span style="flex:1"></span>
    <button class="hot" onclick="reweave()">⟲ REWEAVE GRAPH</button>
    <button onclick="location.href='/'">Ops ▸</button>
    <button onclick="logout()">Lock</button>
  </header>

  <!-- LEFT: system + lead gen -->
  <div class="col">
    <div class="card"><h3>System</h3><div id="sys"></div></div>
    <div class="card">
      <h3>Lead Acquisition</h3>
      <label>Ideal client (ICP)</label><input id="lg_icp" placeholder="edtech startups"/>
      <label>Geo location</label><input id="lg_loc" placeholder="Bangalore, India"/>
      <label>Count</label><input id="lg_n" type="number" value="5"/>
      <div style="height:8px"></div>
      <button onclick="genLeads()" style="width:100%">◎ HUNT LEADS</button>
      <div id="lg_msg" style="font-size:12px;color:var(--dim);min-height:16px"></div>
    </div>
    <div class="card"><h3>Agents</h3><div id="agents" class="row"></div></div>
  </div>

  <!-- CENTER: CRM pipeline -->
  <div class="col">
    <div class="card" style="flex:1;min-height:0">
      <h3>CRM Pipeline — human owns outreach</h3>
      <div id="pipe"></div>
    </div>
  </div>

  <!-- RIGHT: live feed + audit -->
  <div class="col">
    <div class="card" style="flex:1;min-height:0;display:flex;flex-direction:column">
      <h3>Live Orchestra</h3><div class="feed" id="feed"></div>
    </div>
    <div class="card" style="max-height:34vh;overflow:auto">
      <h3>Audit Log</h3><div id="audit"></div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let TOKEN=localStorage.getItem("finesse_token")||""; let ME=null, ws=null;
async function api(p,o={}){o.headers=Object.assign({"Content-Type":"application/json"},o.headers||{});
  if(TOKEN)o.headers["Authorization"]="Bearer "+TOKEN;
  const r=await fetch(p,o); if(!r.ok)throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail); return r.json();}
async function login(){$("li_err").textContent="";try{
  const r=await api("/api/login",{method:"POST",body:JSON.stringify({email:$("li_email").value.trim(),password:$("li_pw").value})});
  TOKEN=r.token;localStorage.setItem("finesse_token",TOKEN);boot();
}catch(e){$("li_err").textContent=e.message;}}
function logout(){localStorage.removeItem("finesse_token");location.reload();}
async function boot(){
  try{ME=await api("/api/me");}catch(e){$("login").style.display="grid";return;}
  if((ME.tier||1)<3){$("login").style.display="none";$("gate").style.display="grid";return;}
  $("login").style.display="none";$("gate").style.display="none";$("wrap").style.display="grid";
  $("who").textContent=ME.role+" · TIER "+ME.tier;
  await refresh(); await loadAgents(); await loadAudit(); connectWS();
  setInterval(refresh,8000);
}
async function refresh(){
  const o=await api("/api/command/overview");
  $("sysline").textContent=o.system.backend+" · brain "+o.system.brain_vectors;
  $("sys").innerHTML=
    kv("LLM backend",o.system.backend)+kv("Vector store",o.system.store)+kv("Embeddings",o.system.embed)+
    kv("Brain vectors",o.system.brain_vectors)+kv("Agents",o.system.agents)+kv("Tools",o.system.tools)+
    kv("Employees",o.users)+kv("Cache hit",(o.turboquant.hit_rate*100).toFixed(0)+"%")+
    kv("Crawler",o.crawler.enabled?"ON":"off")+kv("Auto-reweave",o.crawler.reweave_min+"m");
  const p=await api("/api/crm/pipeline"); renderPipe(p);
}
const kv=(k,v)=>`<div class="kv"><span>${k}</span><span class="v">${v}</span></div>`;
function renderPipe(p){
  $("pipe").innerHTML=p.stages.map(s=>{
    const ls=p.by_stage[s]||[];
    return `<div class="stage"><h4>${s.toUpperCase()} · ${ls.length}</h4>`+
      ls.map(l=>`<div class="lead"><span class="fit">fit ${l.fit_score.toFixed(2)}</span>
        <b>${esc(l.label)}</b><br><span style="color:var(--dim)">${esc(l.location||'—')} · ${esc(l.industry||'')}</span><br>
        <span style="color:var(--dim)">need:</span> ${esc((l.need||'').slice(0,80))}<br>
        <span style="color:var(--amber)">outreach: ${l.outreach_status}</span>
        ${l.outreach_status==='draft'?`<button style="padding:2px 8px;margin-left:6px" onclick="approve('${l.id}')">approve outreach</button>`:''}
        </div>`).join("")+`</div>`;
  }).join("");
}
async function approve(id){ try{await api(`/api/crm/leads/${id}/approve-outreach`,{method:"POST"});refresh();}catch(e){alert(e.message);} }
async function genLeads(){$("lg_msg").textContent="hunting…";try{
  const r=await api("/api/crm/generate",{method:"POST",body:JSON.stringify(
    {icp:$("lg_icp").value,location:$("lg_loc").value,count:+$("lg_n").value})});
  $("lg_msg").textContent=`+${r.generated.length} leads · total ${r.stats.total}`;refresh();
}catch(e){$("lg_msg").textContent=e.message;}}
async function loadAgents(){const {agents}=await api("/api/agents");
  $("agents").innerHTML=agents.map(a=>`<span class="badge">${a.title}</span>`).join("");}
async function loadAudit(){try{const {audit}=await api("/api/audit");
  $("audit").innerHTML=audit.map(a=>`<div class="aud">${new Date(a.ts*1000).toLocaleTimeString()} · ${a.actor} · <b>${a.tool}</b> → ${a.outcome}</div>`).join("")||"<div class='aud'>no activity</div>";}catch(e){}}
async function reweave(){$("sysline").textContent="reweaving…";try{const r=await api("/api/reweave",{method:"POST"});
  alert("Graph reconnected:\n"+JSON.stringify(r.reweave,null,2));refresh();}catch(e){alert(e.message);}}
function connectWS(){const proto=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(TOKEN)}`);
  ws.onmessage=ev=>addEvent(JSON.parse(ev.data));ws.onclose=()=>setTimeout(connectWS,2000);}
function addEvent(e){const f=$("feed");const d=document.createElement("div");d.className="ev "+(e.kind||"system");
  d.innerHTML=`<span class="a">${new Date(e.ts*1000).toLocaleTimeString()} · ${e.actor}</span><br>${esc(e.message)}`;
  f.prepend(d);while(f.children.length>100)f.removeChild(f.lastChild);
  if(e.actor==='leadgen'||e.kind==='system')loadAudit();}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
if(TOKEN)boot(); else $("login").style.display="grid";
</script>
</body>
</html>
