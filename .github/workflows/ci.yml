name: FINESSE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FINESSE_ENV: development
      JWT_SECRET: ci-only-jwt-secret-00000000000000000000000000000000
      CEO_EMAIL: ci@example.invalid
      CEO_PASSWORD: CI-only-password-2026
      KMS_MASTER_KEY: ci-only-kms-material-00000000000000000000000000000000
      EMBEDDINGS_BACKEND: hash
      SALES_DRY_RUN: "true"
      SALES_LIVE_OUTREACH_ENABLED: "false"
      EMAIL_LIVE_ENABLED: "false"
      VOICE_LIVE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build operator workspace
        working-directory: frontend
        run: npm ci && npm run build
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Run unit and integration tests
        run: python -m pytest tests/ -v
      - name: Run production contract suites
        run: python finesse_e2e_production_tests.py
      - name: Ruff lint
        run: >-
          ruff check --select E4,E7,E9,F --ignore E741
          engine/db/migrations.py engine/db/storage.py engine/db/tenant_secrets.py
          engine/auth/security.py engine/config.py engine/hub_api.py
          engine/orchestra/events.py engine/orchestra/jobs.py
          engine/orchestra/langgraph_conjunction.py engine/rag/store.py
          engine/telemetry.py engine/main.py finesse_e2e_production_tests.py
      - name: Mypy critical boundary modules
        run: >-
          mypy --ignore-missing-imports --follow-imports=skip
          engine/db/migrations.py engine/db/tenant_secrets.py engine/telemetry.py
      - name: Python dependency audit
        run: pip-audit -r requirements.txt
      - name: Trivy filesystem security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          ignore-unfixed: true
          exit-code: "1"
